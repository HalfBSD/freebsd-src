name: Cross-build Kernel

on:
  push:
    branches: [ main, halfbsd2, 'stable/[1-9][0-9]' ]
  pull_request:
    branches: [ main, halfbsd2 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target_arch }} ${{ matrix.os }} (${{ matrix.compiler }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target_arch: [ amd64, aarch64 ]
        os: [ ubuntu-22.04, ubuntu-24.04, macos-latest ]
        variant: [ normal, debug, kasan, kcsan, kmsan ]
        exclude:
          - { target_arch: aarch64, variant: debug }
          - { target_arch: aarch64, variant: kasan }
          - { target_arch: aarch64, variant: kcsan }
          - { target_arch: aarch64, variant: kmsan }
          - { os: ubuntu-22.04, variant: debug }
          - { os: ubuntu-22.04, variant: kasan }
          - { os: ubuntu-22.04, variant: kcsan }
          - { os: ubuntu-22.04, variant: kmsan }
          - { os: macos-latest, variant: debug }
          - { os: macos-latest, variant: kasan }
          - { os: macos-latest, variant: kcsan }
          - { os: macos-latest, variant: kmsan }
        include:
          # TODO: both Ubuntu and macOS have bmake packages, we should try them instead of bootstrapping our own copy.
          - os: ubuntu-22.04
            compiler: clang-14
            cross-bindir: /usr/lib/llvm-14/bin
            pkgs: bmake libarchive-dev clang-14 lld-14
          - os: ubuntu-24.04
            compiler: clang-18
            cross-bindir: /usr/lib/llvm-18/bin
            pkgs: bmake libarchive-dev clang-18 lld-18
          - os: macos-latest
            compiler: clang-18
            cross-toolchain: llvm@18
            pkgs: bmake libarchive llvm@18
          - target_arch: amd64
            target: amd64
            kernel-config: HALFBSD
          - target_arch: aarch64
            target: arm64
            kernel-config: GENERIC
    steps:
      - uses: actions/checkout@v4
      - name: install packages (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update --quiet || true
          sudo apt-get -yq --no-install-suggests --no-install-recommends install ${{ matrix.pkgs }}
      - name: install packages (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update --quiet || true
          brew install ${{ matrix.pkgs }} || true
      - name: check HalfBSD build policy
        run: |
          python3 tools/build/check-halfbsd.py --make bmake
          python3 tools/build/tests/halfbsd-firewall.py
      - name: create environment
        run: |
          echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"
          if [ -n "${{ matrix.cross-bindir }}" ]; then
            echo "EXTRA_BUILD_ARGS=--cross-bindir=${{ matrix.cross-bindir }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ matrix.cross-toolchain }}" ]; then
            echo "EXTRA_BUILD_ARGS=--cross-toolchain=${{ matrix.cross-toolchain }}" >> $GITHUB_ENV
          fi
          mkdir -p ../build
          echo "MAKEOBJDIRPREFIX=${PWD%/*}/build" >> $GITHUB_ENV
          # heh, works on Linux/BSD/macOS ...
          echo "NPROC=`getconf _NPROCESSORS_ONLN 2>/dev/null || getconf NPROCESSORS_ONLN 2>/dev/null || echo 1`" >> $GITHUB_ENV
      - name: bootstrap bmake
        run: ./tools/build/make.py --debug $EXTRA_BUILD_ARGS TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} -n
      - name: make kernel-toolchain
        run: ./tools/build/make.py --debug $EXTRA_BUILD_ARGS TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} kernel-toolchain -s -j$NPROC -DWITH_DISK_IMAGE_TOOLS_BOOTSTRAP
      - name: make buildkernel
        run: |
          kernel_config="${{ matrix.kernel-config }}"
          case "${{ matrix.variant }}" in
            debug) kernel_config="${kernel_config}-DEBUG" ;;
            kasan) kernel_config="${kernel_config}-KASAN" ;;
            kcsan) kernel_config="${kernel_config}-KCSAN" ;;
            kmsan) kernel_config="${kernel_config}-KMSAN" ;;
          esac
          module_args=
          if [ "${{ matrix.target_arch }}" != "amd64" ]; then
            module_args=NO_MODULES=yes
          fi
          ./tools/build/make.py --debug $EXTRA_BUILD_ARGS TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} KERNCONF=$kernel_config $module_args buildkernel -s -j$NPROC $EXTRA_MAKE_ARGS
