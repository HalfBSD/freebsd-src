if [ "${CITYPE}" != "smoke" ]; then
export VM_EXTRA_PACKAGES="
archivers/gtar
devel/git
devel/gdb
devel/py-pytest
perl5
lang/python
lang/python3
net/isc-dhcp44-server
net/ndisc6
net/py-dpkt
net/scapy
net/tcptestsuite
security/nist-kat
security/nmap
security/openvpn
security/sudo
shells/ksh93
sysutils/coreutils
sysutils/porch
sysutils/sg3_utils
textproc/jq
"

	if [ "${TARGET}" = "amd64" ]; then
		export VM_EXTRA_PACKAGES="${VM_EXTRA_PACKAGES} devel/linux-ltp"
	fi
fi

vm_extra_pre_umount() {
cat << EOF >> ${DESTDIR}/boot/loader.conf
autoboot_delay=1
beastie_disable="YES"
loader_logo="none"
console="comconsole,vidconsole"
net.fibs=3
net.inet.ip.fw.default_to_accept=1
mac_bsdextended_load="YES"
vfs.zfs.arc_max=4294967296
EOF
cat << EOF >> ${DESTDIR}/etc/kyua/kyua.conf
test_suites.FreeBSD.ci = 'true'
test_suites.FreeBSD.fibs = '1 2'
test_suites.FreeBSD.allow_sysctl_side_effects = '1'
test_suites.FreeBSD.cam_test_device = '/dev/ada0'
test_suites.FreeBSD.disks = '/dev/vtbd2 /dev/vtbd3 /dev/vtbd4 /dev/vtbd5 /dev/vtbd6'
EOF
cat << EOF >> ${DESTDIR}/etc/sysctl.conf
kern.cryptodevallowsoft=1
kern.ipc.tls.enable=1
net.add_addr_allfibs=0
security.mac.bsdextended.enabled=0
vfs.aio.enable_unsafe=1
vfs.usermount=1
EOF
cat << EOF >> ${DESTDIR}/etc/fstab
fdesc                      /dev/fd fdescfs   rw      0       0
EOF
	mkdir -p ${DESTDIR}/usr/local/libexec
	cp -p ${scriptdir}/../../tests/ci/tools/freebsdci ${DESTDIR}/usr/local/libexec/

	return 0
}

vm_extra_pkg_rmcache() {
	if [ -e ${DESTDIR}/usr/local/sbin/pkg ]; then
		mount -t devfs devfs ${DESTDIR}/dev
		chroot ${DESTDIR} ${EMULATOR} env ASSUME_ALWAYS_YES=yes \
			/usr/local/sbin/pkg clean -a
		umount_loop ${DESTDIR}/dev
	fi

	return 0
}
